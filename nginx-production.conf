# /etc/nginx/sites-available/walkie-talkie
# Substitua "seu-dominio.com" pelo domínio real.
# Após editar:  sudo ln -s /etc/nginx/sites-available/walkie-talkie /etc/nginx/sites-enabled/
#               sudo nginx -t && sudo systemctl reload nginx

upstream walkie_ws_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com www.seu-dominio.com;

    # Para validação Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seu-dominio.com www.seu-dominio.com;

    root /var/www/walkie-talkie/public;
    index index.php index.html;

    # SSL — gere com:  sudo certbot --nginx -d seu-dominio.com
    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;

    # Service Worker no escopo correto
    location = /service-worker.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # WebSocket Ratchet
    location /ws {
        proxy_pass http://walkie_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket precisa de timeouts longos
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_connect_timeout 60s;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Cache de estáticos
    location ~* \.(css|js|png|svg|jpg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Bloqueio de arquivos sensíveis
    location ~ /\.(env|git|ht|gitignore) {
        deny all;
    }

    # Bloqueio de pastas internas (caso DocumentRoot esteja errado)
    location ~ ^/(classes|config|database|websocket|storage|vendor|docker)/ {
        deny all;
    }

    # Fallback SPA → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Logs
    access_log /var/log/nginx/walkie-access.log;
    error_log  /var/log/nginx/walkie-error.log;
}
