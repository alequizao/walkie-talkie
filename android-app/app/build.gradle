plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.publishdev.walkietalkie'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.publishdev.walkietalkie'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependências externas: usamos apenas o WebView do próprio Android.
dependencies {
}
