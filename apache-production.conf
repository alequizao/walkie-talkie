# /etc/apache2/sites-available/walkie-talkie.conf
# Habilite os módulos:
#   sudo a2enmod ssl rewrite headers proxy proxy_http proxy_wstunnel
#   sudo a2ensite walkie-talkie
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName seu-dominio.com
    ServerAlias www.seu-dominio.com

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName seu-dominio.com
    ServerAlias www.seu-dominio.com

    DocumentRoot /var/www/walkie-talkie/public

    <Directory /var/www/walkie-talkie/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloqueio de pastas internas
    <DirectoryMatch "/var/www/walkie-talkie/(classes|config|database|websocket|storage|vendor|docker)">
        Require all denied
    </DirectoryMatch>

    # SSL — gere com:  sudo certbot --apache -d seu-dominio.com
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/seu-dominio.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/seu-dominio.com/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder     on
    SSLCipherSuite          HIGH:!aNULL:!MD5

    # WebSocket → backend Ratchet (porta 8080)
    ProxyPreserveHost On
    ProxyPass        /ws ws://127.0.0.1:8080/
    ProxyPassReverse /ws ws://127.0.0.1:8080/

    # Headers de segurança
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "microphone=(self), camera=()"

    <FilesMatch "service-worker\.js$">
        Header set Service-Worker-Allowed "/"
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/walkie-error.log
    CustomLog ${APACHE_LOG_DIR}/walkie-access.log combined
</VirtualHost>
</IfModule>
