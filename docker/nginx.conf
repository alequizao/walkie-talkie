upstream walkie_ws {
    server websocket:8080;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 10M;

    # Service worker no escopo correto
    location = /service-worker.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # WebSocket → backend Ratchet
    location /ws {
        proxy_pass http://walkie_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # PHP / API
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Estáticos com cache
    location ~* \.(css|js|png|svg|jpg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Bloqueia .env, .git, etc
    location ~ /\.(env|git|ht) {
        deny all;
    }

    # Tudo o que não for arquivo cai em index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Headers de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
}
