version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: walkie-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
    depends_on:
      - mysql
    networks:
      - walkie-net

  websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket
    container_name: walkie-ws
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - walkie-net

  nginx:
    image: nginx:alpine
    container_name: walkie-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Para SSL real, monte aqui seus certificados:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - websocket
    networks:
      - walkie-net

  mysql:
    image: mysql:8.0
    container_name: walkie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: walkie_talkie
      MYSQL_USER: walkie
      MYSQL_PASSWORD: walkie_pass
    volumes:
      - walkie-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    networks:
      - walkie-net

  # Opcional: Redis para escalar PUB/SUB futuramente
  # redis:
  #   image: redis:alpine
  #   container_name: walkie-redis
  #   restart: unless-stopped
  #   networks:
  #     - walkie-net

networks:
  walkie-net:
    driver: bridge

volumes:
  walkie-mysql-data:
